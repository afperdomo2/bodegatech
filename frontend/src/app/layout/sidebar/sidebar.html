<nav class="h-full flex flex-col">
  <!-- Logo -->
  <div class="p-6 border-b border-gray-200">
    <h1 class="text-2xl font-bold text-blue-600">BodegaTech</h1>
  </div>

  <!-- Menu Items -->
  <ul class="flex-1 p-4 space-y-2">
    @for (item of menuItems; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-blue-50 text-blue-600"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center space-x-3 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition"
        >
          <span class="text-xl">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <!-- Footer -->
  <div class="p-4 border-t border-gray-200 text-sm text-gray-500">
    <p>v1.0.0</p>
  </div>
</nav>
