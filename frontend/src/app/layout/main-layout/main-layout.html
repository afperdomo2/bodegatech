<div class="flex h-screen bg-surface overflow-hidden">
  <!-- Mobile overlay -->
  <div
    class="fixed inset-0 bg-black/50 z-30 md:hidden transition-opacity duration-300"
    [class.opacity-0]="!sidebarOpen()"
    [class.pointer-events-none]="!sidebarOpen()"
    (click)="toggleSidebar()">
  </div>

  <!-- Sidebar -->
  <bt-sidebar
    [isSidebarOpen]="sidebarOpen()"
    (sidebarToggled)="toggleSidebar()">
  </bt-sidebar>

  <!-- Main content area -->
  <div class="flex-1 flex flex-col overflow-hidden w-full md:w-auto">
    <!-- Topbar -->
    <bt-topbar
      (sidebarToggled)="toggleSidebar()">
    </bt-topbar>

    <!-- Page content -->
    <main class="flex-1 overflow-auto bg-surface">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
