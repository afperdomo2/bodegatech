<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none">
  @for (toast of toasts(); track toast.id) {
    <div
      [class]="getColorClasses(toast.type)"
      role="alert">
      <span class="material-symbols-outlined text-xl flex-shrink-0">
        {{ getIconForType(toast.type) }}
      </span>
      <p class="text-sm font-medium flex-1">{{ toast.message }}</p>
      <button
        (click)="dismiss(toast.id)"
        class="flex-shrink-0 ml-2 hover:opacity-70 transition-opacity"
        aria-label="Cerrar notificación">
        <span class="material-symbols-outlined text-lg">close</span>
      </button>
    </div>
  }
</div>
