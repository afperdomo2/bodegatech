<div class="flex items-center justify-center">
  @if (src()) {
    <div
      class="rounded-lg overflow-hidden border border-surface-200 cursor-default"
      [style.width.px]="size()"
      [style.height.px]="size()"
      (mouseenter)="onMouseEnter($event)"
      (mouseleave)="onMouseLeave()">
      <img [src]="src()" [alt]="alt()" class="h-full w-full object-cover" />
    </div>

    @if (showPreview()) {
      <div
        class="fixed pointer-events-none z-[9999] rounded-xl shadow-2xl border border-surface-200 overflow-hidden"
        [ngStyle]="previewStyle()">
        <img [src]="src()" [alt]="alt()" class="w-full h-full object-cover" />
      </div>
    }
  } @else {
    <div
      class="rounded-lg border border-dashed border-surface-200 flex items-center justify-center bg-surface-50 cursor-default"
      [style.width.px]="size()"
      [style.height.px]="size()">
      <span class="material-symbols-outlined text-sm text-surface-300">{{ placeholder() }}</span>
    </div>
  }
</div>
