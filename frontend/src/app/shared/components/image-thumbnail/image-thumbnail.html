<div class="flex items-center justify-center">
  @if (src()) {
    <div class="relative group/imgpreview cursor-default">
      <div
        class="rounded-lg overflow-hidden border border-surface-200"
        [style.width.px]="size()"
        [style.height.px]="size()">
        <img [src]="src()" [alt]="alt()" class="h-full w-full object-cover" />
      </div>
      <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-20
                  opacity-0 group-hover/imgpreview:opacity-100
                  pointer-events-none transition-opacity duration-200">
        <img
          [src]="src()"
          [alt]="alt()"
          class="rounded-xl shadow-xl border border-surface-200 object-cover"
          [style.width.px]="previewSize()"
          [style.height.px]="previewSize()" />
      </div>
    </div>
  } @else {
    <div
      class="rounded-lg border border-dashed border-surface-200 flex items-center justify-center bg-surface-50 cursor-default"
      [style.width.px]="size()"
      [style.height.px]="size()">
      <span class="material-symbols-outlined text-sm text-surface-300">{{ placeholder() }}</span>
    </div>
  }
</div>
