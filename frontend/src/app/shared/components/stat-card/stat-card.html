<div class="bg-white rounded-lg p-6 shadow-sm border border-surface-200 hover:shadow-md transition-shadow">
  <!-- Header with icon -->
  <div class="flex items-start justify-between mb-4">
    <div
      [class]="'flex items-center justify-center w-12 h-12 rounded-lg ' +
               (variant() === 'primary' ? 'bg-primary/10 text-primary' :
                variant() === 'secondary' ? 'bg-secondary/10 text-secondary' :
                variant() === 'error' ? 'bg-error/10 text-error' :
                'bg-warning/10 text-warning')">
      <span class="material-symbols-outlined text-xl">{{ icon() }}</span>
    </div>
  </div>

  <!-- Title -->
  <h3 class="text-sm font-medium text-surface-700 mb-2">{{ title() }}</h3>

  <!-- Value -->
  <div class="flex items-baseline gap-2 mb-2">
    <span class="text-2xl font-semibold text-surface-900">{{ value() }}</span>
    @if (trendValue()) {
      <span
        [class]="'inline-flex items-center gap-1 text-sm font-medium ' +
                 (trendIcon() === 'trending_up' ? 'text-success' :
                  trendIcon() === 'trending_down' ? 'text-error' :
                  'text-surface-500')">
        <span class="material-symbols-outlined text-base">{{ trendIcon() }}</span>
        <span>{{ trendValue() }}</span>
      </span>
    }
  </div>
</div>
