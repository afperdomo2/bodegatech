@if (modalService.isOpen()) {
  <!-- Backdrop + Centering Container -->
  <div
    class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 flex items-center justify-center p-4 animate-fadeIn"
    (click)="modalService.cancel()">
    <!-- Modal -->
    <div
      [class]="'bg-white rounded-xl shadow-dialog w-full z-50 animate-slideDown ' + sizeClass()"
      (click)="$event.stopPropagation()">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-surface-200">
        <h2 class="text-lg font-semibold text-surface-900">{{ modalService.title() }}</h2>
        <button
          (click)="onCancel()"
          class="p-2 hover:bg-surface-100 rounded-lg transition-colors text-surface-600 hover:text-surface-900">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Content -->
      <div class="px-6 py-4">
        @if (modalService.template()) {
          <ng-container *ngTemplateOutlet="modalService.template()"></ng-container>
        }
      </div>

      <!-- Footer -->
      <div class="flex gap-3 justify-end px-6 py-4 border-t border-surface-200 bg-surface-50">
        <button
          (click)="onCancel()"
          class="px-4 py-2 rounded-lg border border-outline-variant bg-surface-container text-sm font-medium text-on-surface hover:bg-surface-container-high hover:border-outline transition-colors cursor-pointer">
          Cancelar
        </button>
        <button
          (click)="onConfirm()"
          class="px-4 py-2 rounded-lg bg-primary text-on-primary text-sm font-medium hover:bg-primary-600 transition-colors">
          Confirmar
        </button>
      </div>
    </div>
  </div>
}
