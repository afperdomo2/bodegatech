<label class="flex items-center gap-3 cursor-pointer">
  <div class="relative w-12 h-7 bg-surface-200 rounded-full transition-colors" [class.bg-primary]="checked()">
    <input
      type="checkbox"
      [checked]="checked()"
      (change)="onToggle($event)"
      class="opacity-0 absolute inset-0 w-full h-full cursor-pointer">
    <span
      class="absolute top-1 left-1 w-5 h-5 bg-white rounded-full transition-transform"
      [class.translate-x-5]="checked()"></span>
  </div>
  <div class="flex items-center gap-2">
    @if (icon()) {
      <span class="material-symbols-outlined text-surface-700">{{ icon() }}</span>
    }
    @if (label()) {
      <span class="text-sm font-medium text-surface-900">{{ label() }}</span>
    }
  </div>
</label>
