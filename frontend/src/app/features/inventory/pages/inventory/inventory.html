<div class="p-4 md:p-8 space-y-6">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <bt-page-header
      title="Gestión de Inventario"
      subtitle="Administra tu catálogo de productos">
      <button
        (click)="onRefresh()"
        class="flex items-center justify-center gap-2 px-4 py-2 text-on-surface hover:bg-surface-container rounded-lg transition-colors whitespace-nowrap"
        [disabled]="loading()">
        <span class="material-symbols-outlined">refresh</span>
        <span class="hidden sm:inline">Refrescar</span>
      </button>
      <button
        (click)="onAddProduct()"
        class="flex items-center justify-center gap-2 px-4 py-2 bg-primary text-on-primary font-medium rounded-lg hover:bg-primary-container transition-colors whitespace-nowrap">
        <span class="material-symbols-outlined">add</span>
        <span class="hidden sm:inline">Añadir Producto</span>
        <span class="sm:hidden">Añadir</span>
      </button>
    </bt-page-header>
  </div>

  <!-- Filter Bar -->
  <div class="bg-surface-container-lowest rounded-lg p-3 md:p-4 shadow-sm border border-outline-variant flex flex-col gap-3 md:flex-row md:gap-4 md:flex-wrap">
    <!-- Search -->
    <div class="flex-1 min-w-0 md:min-w-72">
      <bt-search-input
        placeholder="Buscar por nombre o SKU..."
        [value]="searchQuery()"
        (searchChange)="onSearch($event)">
      </bt-search-input>
    </div>

    <!-- Category Filter -->
    <select
      [value]="selectedCategory()"
      (change)="handleCategoryChange($event)"
      class="px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary">
      <option value="">Todas las categorías</option>
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>

    <!-- Status Filter -->
    <select
      [value]="selectedStatus()"
      (change)="handleStatusChange($event)"
      class="px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary">
      <option value="">Todos los estados</option>
      @for (status of statuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>

    <!-- Advanced Filter Button -->
    <button
      class="flex items-center justify-center gap-2 px-4 py-2 text-on-surface hover:bg-surface-container rounded-lg transition-colors whitespace-nowrap">
      <span class="material-symbols-outlined">tune</span>
      <span class="hidden md:inline">Filtros avanzados</span>
    </button>
  </div>

  <!-- Data Table -->
  <bt-data-table
    [columns]="columns"
    [data]="products()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalItems]="products().length"
    [loading]="loading()"
    (pageChange)="onPageChange($event)"
    (editClick)="onEditClick($event)"
    (deleteClick)="onDeleteClick($event)">
  </bt-data-table>
</div>

<!-- Product Modal Template -->
<ng-template #productModal let-close="close">
  <div class="space-y-4">
    <h2 class="text-xl font-semibold text-on-surface">
      {{ selectedProduct() ? 'Editar Producto' : 'Nuevo Producto' }}
    </h2>
    <div class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-on-surface mb-1">SKU</label>
        <input
          type="text"
          [value]="selectedProduct()?.sku || ''"
          class="w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"
          [disabled]="!!selectedProduct()">
      </div>
      <div>
        <label class="block text-sm font-medium text-on-surface mb-1">Nombre del Producto</label>
        <input
          type="text"
          [value]="selectedProduct()?.name || ''"
          class="w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary">
      </div>
      <div>
        <label class="block text-sm font-medium text-on-surface mb-1">Categoría</label>
        <select
          class="w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary">
          @for (cat of categories; track cat) {
            <option [selected]="selectedProduct()?.category === cat">{{ cat }}</option>
          }
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-on-surface mb-1">Stock Actual</label>
          <input
            type="number"
            [value]="selectedProduct()?.stock || ''"
            class="w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
        <div>
          <label class="block text-sm font-medium text-on-surface mb-1">Precio</label>
          <input
            type="number"
            [value]="selectedProduct()?.price || ''"
            class="w-full px-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
      </div>
    </div>
    <div class="flex justify-end gap-3 pt-4 border-t border-outline-variant">
      <button
        (click)="onCloseModal()"
        class="px-4 py-2 text-on-surface hover:bg-surface-container rounded-lg transition-colors">
        Cancelar
      </button>
      <button
        (click)="onSaveProduct()"
        class="px-4 py-2 bg-primary text-on-primary font-medium rounded-lg hover:bg-primary-container transition-colors">
        Guardar
      </button>
    </div>
  </div>
</ng-template>

<!-- Delete Confirmation Modal Template -->
<ng-template #deleteModal let-close="close">
  <div class="space-y-4">
    <h2 class="text-xl font-semibold text-on-surface">Confirmar Eliminación</h2>
    <p class="text-on-surface-variant">
      ¿Estás seguro de que deseas eliminar el producto <strong>{{ selectedProduct()?.name }}</strong>?
    </p>
    <div class="flex justify-end gap-3 pt-4 border-t border-outline-variant">
      <button
        (click)="onCloseModal()"
        class="px-4 py-2 text-on-surface hover:bg-surface-container rounded-lg transition-colors">
        Cancelar
      </button>
      <button
        (click)="onConfirmDelete()"
        class="px-4 py-2 bg-error text-on-error font-medium rounded-lg hover:bg-error-container transition-colors">
        Eliminar
      </button>
    </div>
  </div>
</ng-template>
