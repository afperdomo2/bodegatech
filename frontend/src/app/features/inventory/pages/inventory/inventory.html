<div class="p-4 md:p-8 space-y-6">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <bt-page-header
      title="Gestión de Inventario"
      subtitle="Administra tu catálogo de productos">
    </bt-page-header>
    <button
      class="flex items-center justify-center gap-2 px-4 py-2 bg-primary text-on-primary font-medium rounded-lg hover:bg-on-primary-fixed-variant transition-colors whitespace-nowrap">
      <span class="material-symbols-outlined">add</span>
      <span class="hidden sm:inline">Añadir Producto</span>
      <span class="sm:hidden">Añadir</span>
    </button>
  </div>

  <!-- Filter Bar -->
  <div class="bg-surface-container-lowest rounded-lg p-3 md:p-4 shadow-sm border border-outline-variant flex flex-col gap-3 md:flex-row md:gap-4 md:flex-wrap">
    <!-- Search -->
    <div class="flex-1 min-w-0 md:min-w-72">
      <bt-search-input
        placeholder="Buscar por nombre o SKU..."
        [value]="searchQuery()"
        (searchChange)="onSearch($event)">
      </bt-search-input>
    </div>

    <!-- Category Filter -->
    <select
      [value]="selectedCategory()"
      (change)="handleCategoryChange($event)"
      class="px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary">
      <option value="">Todas las categorías</option>
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>

    <!-- Status Filter -->
    <select
      [value]="selectedStatus()"
      (change)="handleStatusChange($event)"
      class="px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary">
      <option value="">Todos los estados</option>
      @for (status of statuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>

    <!-- Advanced Filter Button -->
    <button
      class="flex items-center justify-center gap-2 px-4 py-2 text-on-surface hover:bg-surface-container rounded-lg transition-colors whitespace-nowrap">
      <span class="material-symbols-outlined">tune</span>
      <span class="hidden md:inline">Filtros avanzados</span>
    </button>
  </div>

  <!-- Data Table -->
  <bt-data-table
    [columns]="columns"
    [data]="products()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalItems]="products().length">
  </bt-data-table>
</div>
