<div class="p-4 md:p-8 space-y-8">
  <!-- Page Header -->
  <bt-page-header
    title="Administración"
    subtitle="Gestiona usuarios y configuración del sistema">
  </bt-page-header>

  <!-- Main Grid: Users and Settings -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
    <!-- Users Management -->
    <div class="lg:col-span-2 bg-surface-container-lowest rounded-lg p-4 md:p-6 shadow-sm border border-outline-variant">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <h2 class="text-lg font-semibold text-on-surface">Gestión de Usuarios</h2>
        <button
          (click)="onInviteUserClick()"
          class="flex items-center justify-center gap-2 px-4 py-2 bg-primary text-on-primary font-medium rounded-lg hover:bg-on-primary-fixed-variant transition-colors whitespace-nowrap">
          <span class="material-symbols-outlined">person_add</span>
          <span class="hidden sm:inline">Invitar Usuario</span>
          <span class="sm:hidden">Invitar</span>
        </button>
      </div>

      <!-- Users Table -->
      <bt-data-table
        [columns]="usersColumns"
        [data]="users()"
        [currentPage]="1"
        [pageSize]="10"
        [totalItems]="users().length"
        (pageChange)="onPageChange($event)"
        (editClick)="onUserEditClick($event)"
        (deleteClick)="onUserDeleteClick($event)">
      </bt-data-table>
    </div>

    <!-- Settings Section -->
    <div class="bg-surface-container-lowest rounded-lg p-4 md:p-6 shadow-sm border border-outline-variant">
      <h2 class="text-lg font-semibold text-on-surface mb-6">Configuración del Sistema</h2>

      <div class="space-y-6">
        <!-- Company Name -->
        <div>
          <label class="block text-sm font-medium text-on-surface mb-2">Nombre de Empresa</label>
          <input
            type="text"
            [value]="companyName()"
            (input)="onCompanyNameChange($event.target.value)"
            class="w-full px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-all">
        </div>

        <!-- Currency Select -->
        <div>
          <label class="block text-sm font-medium text-on-surface mb-2">Moneda Predeterminada</label>
          <select
            [value]="currency()"
            (change)="handleCurrencyChange($event)"
            class="w-full px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary">
            <option value="USD">USD - Dólar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="MXN">MXN - Peso Mexicano</option>
            <option value="COP">COP - Peso Colombiano</option>
          </select>
        </div>

        <!-- Notifications Section -->
        <div class="pt-4 border-t border-outline-variant">
          <h3 class="text-sm font-semibold text-on-surface mb-4">Notificaciones</h3>
          <div class="space-y-4">
            <!-- Email Toggle -->
            <bt-toggle
              icon="mail"
              label="Alertas por Email"
              [checked]="emailNotifications()"
              (checkedChange)="onEmailToggle($event)">
            </bt-toggle>

            <!-- SMS Toggle -->
            <bt-toggle
              icon="sms"
              label="Alertas por SMS (Críticas)"
              [checked]="smsNotifications()"
              (checkedChange)="onSmsToggle($event)">
            </bt-toggle>
          </div>
        </div>

        <!-- Save Button -->
        <button
          (click)="onSaveConfiguration()"
          class="w-full px-4 py-2.5 bg-primary text-on-primary font-medium rounded-lg hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2">
          <span class="material-symbols-outlined">save</span>
          Guardar Configuración
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Create User Modal -->
<ng-template #createUserModal>
  <div class="space-y-4">
    <!-- Name Input -->
    <div>
      <label class="block text-sm font-medium text-on-surface mb-2">Nombre Completo</label>
      <input
        type="text"
        [(ngModel)]="userFormModel().name"
        placeholder="Ej: Juan Pérez"
        class="w-full px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary transition-all">
    </div>

    <!-- Email Input -->
    <div>
      <label class="block text-sm font-medium text-on-surface mb-2">Email</label>
      <input
        type="email"
        [(ngModel)]="userFormModel().email"
        placeholder="Ej: juan@bodegatech.com"
        class="w-full px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary transition-all">
    </div>

    <!-- Role Select -->
    <div>
      <label class="block text-sm font-medium text-on-surface mb-2">Rol</label>
      <select
        [(ngModel)]="userFormModel().role"
        class="w-full px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-all">
        <option value="Viewer">Viewer - Solo lectura</option>
        <option value="Editor">Editor - Edición limitada</option>
        <option value="Admin">Admin - Acceso completo</option>
      </select>
    </div>

    <!-- Error Message -->
    @if (formError()) {
      <div class="p-3 rounded-lg bg-error/10 text-error text-sm">{{ formError() }}</div>
    }
  </div>
</ng-template>

        class="w-full px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary transition-all">

        class="w-full px-4 py-2 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-surface-400 focus:outline-none focus:ring-2 focus:ring-primary transition-all">
    </div>

    <!-- Role Select -->
    <div>
      <label class="block text-sm font-medium text-on-surface mb-2">Rol</label>
      <select

        <option value="Viewer">Viewer - Solo lectura</option>

<!-- Delete User Modal -->
<ng-template #deleteUserModal>
  <div class="space-y-4">
    <p class="text-on-surface">
      ¿Estás seguro de que deseas eliminar este usuario? Esta acción no se puede deshacer.
    </p>
    <div class="p-4 rounded-lg bg-warning/10 border border-warning/30">
      <p class="text-sm text-warning font-medium">
        <span class="material-symbols-outlined align-text-bottom">warning</span>
        Esta acción eliminará todos los datos asociados al usuario.
      </p>
    </div>
  </div>
</ng-template>
