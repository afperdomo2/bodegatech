<div class="p-4 md:p-8 space-y-8">
  <!-- Page Header with Actions -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <bt-page-header
        title="Dashboard"
        subtitle="Resumen de tu sistema de inventario">
      </bt-page-header>
    </div>
    <div class="flex flex-col sm:flex-row gap-3">
      <button
        class="flex items-center justify-center gap-2 px-4 py-2 bg-surface-100 text-surface-700 font-medium rounded-lg hover:bg-surface-200 transition-colors">
        <span class="material-symbols-outlined text-lg">calendar_today</span>
        <span class="hidden sm:inline">Hoy</span>
      </button>
      <button
        class="flex items-center justify-center gap-2 px-4 py-2 bg-primary text-on-primary font-medium rounded-lg hover:bg-on-primary-fixed-variant transition-colors">
        <span class="material-symbols-outlined text-lg">download</span>
        <span class="hidden sm:inline">Exportar</span>
      </button>
    </div>
  </div>

  <!-- KPI Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
    @for (stat of stats(); track stat.title) {
      <bt-stat-card
        [title]="stat.title"
        [value]="stat.value"
        [trendValue]="stat.trendValue"
        [trendIcon]="stat.trendIcon"
        [icon]="stat.icon"
        [variant]="stat.variant">
      </bt-stat-card>
    }
  </div>

  <!-- Charts and Activity Section -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
    <!-- Bar Chart -->
    <div class="lg:col-span-2 bg-surface-container-lowest rounded-lg p-4 md:p-6 shadow-sm border border-outline-variant">
      <h2 class="text-lg font-semibold text-on-surface mb-4">Movimientos de Stock</h2>
      <div class="relative h-72">
        <canvas #barChartCanvas></canvas>
      </div>
    </div>

    <!-- Recent Activities -->
    <div class="bg-surface-container-lowest rounded-lg p-4 md:p-6 shadow-sm border border-outline-variant">
      <h2 class="text-lg font-semibold text-on-surface mb-4">Actividad Reciente</h2>
      <div class="space-y-3 max-h-80 overflow-y-auto">
        @for (activity of activities(); track activity.id) {
          <div
            [class]="'flex gap-3 p-3 rounded-lg ' + getActivityBgColor(activity.type)">
            <div class="flex-shrink-0">
              <span
                [class]="'material-symbols-outlined flex items-center justify-center w-8 h-8 rounded-full ' +
                         getActivityIconColor(activity.type)">
                {{ activity.icon }}
              </span>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-on-surface line-clamp-2">
                {{ activity.description }}
              </p>
              <p class="text-xs text-on-surface-variant mt-1">{{ activity.timestamp }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
