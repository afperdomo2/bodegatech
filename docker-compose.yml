name: bodegatech-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bodegatech_db
      POSTGRES_USER: bodegatech_user
      POSTGRES_PASSWORD: bodegatech_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodegatech_user -d bodegatech_db"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - bodegatech_network

volumes:
  postgres_data:

networks:
  bodegatech_network:
    driver: bridge
