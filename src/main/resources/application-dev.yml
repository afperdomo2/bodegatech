spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/bodegatech_db
    username: bodegatech_user
    password: bodegatech_password

logging:
  level:
    root: INFO
    com.afperdomo.bodegatech: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
