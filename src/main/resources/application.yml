spring:
  application:
    name: bodegatech
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/bodegatech_db
    username: bodegatech_user
    password: bodegatech_password
    driver-class-name: org.postgresql.Driver
  profiles:
    active: dev

# Logging
logging:
  level:
    root: INFO
    com.afperdomo.bodegatech: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Server
server:
  port: 8080
  servlet:
    context-path: /api/v1

# OpenAPI / Swagger
spring-doc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
