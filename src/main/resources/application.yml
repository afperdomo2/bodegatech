spring:
  application:
    name: bodegatech
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/bodegatech_db
    username: bodegatech_user
    password: bodegatech_password
    driver-class-name: org.postgresql.Driver
  profiles:
    active: dev

# Logging
logging:
  level:
    root: INFO
    com.afperdomo.bodegatech: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Server
server:
  port: 8080

# OpenAPI / Swagger
spring-doc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# CORS Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}
  aws:
    region: ${AWS_REGION:us-east-1}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:bodegatech-uploads}
      public-url: ${AWS_S3_PUBLIC_URL:https://bodegatech-uploads.s3.amazonaws.com}
      presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_EXPIRATION:15}
