spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bodegatech_db}
    username: ${DB_USER:bodegatech_user}
    password: ${DB_PASSWORD:bodegatech_password}

logging:
  level:
    root: WARN
    com.afperdomo.bodegatech: INFO

server:
  port: ${SERVER_PORT:8080}
